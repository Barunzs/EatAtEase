                    // Reset all chips
                    chips.forEach(c => {
                        c.className = 'flex items-center gap-xs px-md py-sm rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface-variant hover:bg-surface-container-low whitespace-nowrap active:scale-95 transition-transform';
                    });
                    // Set active chip
                    chip.className = 'flex items-center gap-xs px-md py-sm rounded-full bg-primary text-on-primary whitespace-nowrap shadow-level-1 active:scale-95 transition-transform';
                });
            });
        });
    </script>
</body></html>
