<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EatAtEase - Login</title>

                        "on-tertiary-fixed": "#07006c",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface": "#f9f9fc",
                        "tertiary-container": "#2927ba",
                        "on-surface": "#1a1c1e",
                        "on-secondary-fixed-variant": "#793100",
                        "tertiary": "#0e009d",
                        "inverse-on-surface": "#f0f0f3",

                        "primary-fixed-dim": "#bcc3ff",
                        "surface-container-highest": "#e2e2e5",
                        "on-background": "#1a1c1e",
                        "secondary-container": "#fe7a2b",
                        "on-surface-variant": "#454651",
                        "tertiary-fixed-dim": "#c0c1ff",
                        "surface-container": "#eeeef0",
                        "on-secondary-fixed": "#341100",
                        "primary-container": "#2e3a8c",
                        "surface-container-low": "#f3f3f6",
                        "secondary-fixed": "#ffdbcb",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e8e8ea",
                        "surface-dim": "#dadadc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1.25rem"
                    },
                    "spacing": {

<style>
        .gradient-bg {
            background: linear-gradient(135deg, #142175 0%, #a4a7ff 50%, #f9f9fc 100%);
        }
        .blob-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: rgba(223, 224, 255, 0.4);
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            animation: float 10s ease-in-out infinite alternate;
        }
        .blob-2 {
            position: absolute;
            bottom: 10%;
            right: -20%;
            width: 60vw;
            height: 60vw;
            background: rgba(188, 195, 255, 0.3);
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            animation: float 12s ease-in-out infinite alternate-reverse;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }
        .tab-btn {
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #142175;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .tab-btn.inactive {
            color: #767682;
            background-color: transparent;
        }
        .input-field {
            background-color: #F0F1F5;
            border: 2px solid transparent;
            transition: border-color 0.2s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #142175;
            background-color: #ffffff;
        }
        .gradient-btn {
            background: linear-gradient(90deg, #142175 0%, #2e3a8c 100%);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(20, 33, 117, 0.3);
        }
        .gradient-btn:active {
            transform: translateY(0);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full flex items-center justify-center p-margin-mobile overflow-hidden gradient-bg relative font-['Inter']">
<!-- Decorative Blobs -->
<div class="blob-1 pointer-events-none"></div>
<div class="blob-2 pointer-events-none"></div>
<!-- Main Container -->
<main class="w-full max-w-md z-10 glass-card rounded-2xl p-xl flex flex-col items-center">
<!-- Logo & Header -->
<div class="flex flex-col items-center mb-xl w-full">
<div class="w-20 h-20 rounded-full bg-primary text-on-primary flex items-center justify-center mb-sm shadow-lg">
<span class="font-display-lg text-[40px] leading-none">E</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-xs">EatAtEase</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Shop Smarter. Live Better.</p>
</div>
<!-- Segmented Tabs -->
<div class="w-full bg-surface-container-high rounded-full p-xs flex mb-lg">
<button class="tab-btn active flex-1 rounded-full py-sm font-label-caps text-label-caps" id="tab-email" onclick="switchTab('email')">
                Email
            </button>
<button class="tab-btn inactive flex-1 rounded-full py-sm font-label-caps text-label-caps" id="tab-phone" onclick="switchTab('phone')">
                Phone OTP
            </button>
</div>
<!-- Email Form -->
<form class="w-full flex flex-col gap-md transition-opacity duration-300" id="form-email">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-sm" for="email">Email Address</label>
<input class="input-field w-full rounded-full px-md py-sm font-body-md text-body-md text-on-surface" id="email" placeholder="hello@example.com" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center ml-sm mr-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative w-full">
<input class="input-field w-full rounded-full pl-md pr-xl py-sm font-body-md text-body-md text-on-surface" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline p-xs hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<button class="gradient-btn w-full rounded-full py-sm mt-sm font-label-caps text-label-caps text-on-primary" type="button">
                Sign In
            </button>
</form>
<!-- Phone Form (Hidden initially) -->
<form class="w-full flex flex-col gap-md transition-opacity duration-300 hidden opacity-0" id="form-phone">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-sm" for="phone">Phone Number</label>
<div class="flex gap-sm">
<div class="bg-surface-container-high rounded-full px-sm py-sm flex items-center justify-center">
<span class="font-body-md text-body-md text-on-surface font-semibold">+91</span>
</div>
<input class="input-field w-full rounded-full px-md py-sm font-body-md text-body-md text-on-surface" id="phone" placeholder="98765 43210" type="tel"/>
</div>
</div>
<p class="font-body-md text-body-md text-outline-variant text-center px-sm mt-xs text-[12px]">
                We'll send a secure one-time password to verify your account.
            </p>
<button class="gradient-btn w-full rounded-full py-sm mt-sm font-label-caps text-label-caps text-on-primary" type="button">
                Send OTP
            </button>
</form>
<!-- Footer -->
<div class="mt-xl w-full flex flex-col items-center">
<p class="font-body-md text-body-md text-on-surface-variant text-[12px] text-center">
                By continuing, you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a> &amp; <a class="text-primary hover:underline" href="#">Privacy Policy</a>
</p>
</div>
</main>
<script>
        function switchTab(mode) {
            const btnEmail = document.getElementById('tab-email');
            const btnPhone = document.getElementById('tab-phone');
            const formEmail = document.getElementById('form-email');
            const formPhone = document.getElementById('form-phone');

            if (mode === 'email') {
                btnEmail.classList.replace('inactive', 'active');
                btnPhone.classList.replace('active', 'inactive');
                
                formPhone.classList.add('opacity-0');
                setTimeout(() => {
                    formPhone.classList.add('hidden');
                    formEmail.classList.remove('hidden');
                    // tiny delay to allow display block to apply before opacity fade in
                    setTimeout(() => formEmail.classList.remove('opacity-0'), 10);
                }, 300);
            } else {
                btnPhone.classList.replace('inactive', 'active');
                btnEmail.classList.replace('active', 'inactive');
                
                formEmail.classList.add('opacity-0');
                setTimeout(() => {
                    formEmail.classList.add('hidden');
                    formPhone.classList.remove('hidden');
                    setTimeout(() => formPhone.classList.remove('opacity-0'), 10);
                }, 300);
            }
        }
    </script>
</body></html>
