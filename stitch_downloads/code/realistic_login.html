<body class="bg-gradient-to-br from-surface to-surface-container-high text-on-surface antialiased min-h-[884px] flex items-center justify-center p-margin-mobile relative overflow-hidden">
<!-- Subtle Mesh Gradient Background Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container rounded-full mix-blend-multiply filter blur-[100px] opacity-20 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-container rounded-full mix-blend-multiply filter blur-[120px] opacity-20 pointer-events-none"></div>
<!-- Main Container -->
<main class="w-full max-w-[420px] flex flex-col gap-xl bg-surface/80 backdrop-blur-xl p-xl rounded-xl shadow-lg border border-surface-variant z-10 relative">
<!-- Header / Logo Area -->
<header class="flex flex-col items-center text-center gap-sm">
<div class="w-16 h-16 rounded-full bg-gradient-to-br from-primary-container to-secondary-container flex items-center justify-center mb-sm shadow-md">
<span class="material-symbols-outlined text-on-primary-container text-[32px]" style="font-variation-settings: 'FILL' 1;">
                    shopping_bag
                </span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">ShopModern</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Please enter your details.</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Input Group -->
<div class="flex flex-col gap-md">
<!-- Email Input -->
<div class="relative bg-surface-container-lowest/50 backdrop-blur-sm rounded-lg border border-outline-variant focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all px-md py-sm shadow-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-[2px]" for="email">
                        Email
                    </label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant outline-none" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative bg-surface-container-lowest/50 backdrop-blur-sm rounded-lg border border-outline-variant focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all px-md py-sm flex items-center shadow-sm">
<div class="flex-grow">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-[2px]" for="password">
                            Password
                        </label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="text-on-surface-variant hover:text-on-surface p-sm focus:outline-none transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Additional Actions -->
<div class="flex items-center justify-between mt-[-8px]">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center">
<input class="peer appearance-none w-4 h-4 rounded-DEFAULT border-2 border-outline checked:bg-primary checked:border-primary transition-colors cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-surface" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[14px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 peer-checked:opacity-100 pointer-events-none" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-surface-tint transition-colors" href="#">
                    Forgot password?
                </a>
</div>
<!-- Submit Button -->
<button class="w-full bg-gradient-to-r from-primary to-surface-tint hover:from-surface-tint hover:to-primary active:from-on-primary-fixed-variant active:to-primary text-on-primary font-label-md text-label-md py-[14px] px-lg rounded-full shadow-md hover:shadow-lg transition-all duration-300 flex justify-center items-center gap-sm mt-sm transform hover:-translate-y-[1px]" type="submit">
                Sign In
            </button>
</form>
<!-- Footer Links -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:text-surface-tint transition-colors ml-xs font-semibold" href="#">
                    Sign up
                </a>
</p>
</div>
